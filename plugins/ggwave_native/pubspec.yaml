name: ggwave_native
description: ggwave data-over-sound encode/decode bindings (Windows + Android).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.wave.ggwave
        pluginClass: GgwaveNativePlugin
      windows:
        pluginClass: GgwaveNativePluginCApi