name: wave_audio
description: Low-latency PCM16 audio I/O for Wave P2P voice calls (Windows WASAPI).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WaveAudioPluginCApi